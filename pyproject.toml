[project]
name = "redis-lock-demo"
version = "0.1.0"
description = "Reference implementation of Redis Single-Node Lock with Watchdog, 5-Node Redlock, and SQLite Ticket Inventory Demo."
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-html>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redis_lock_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "INFO"
addopts = [
    "--junitxml=reports/junit.xml",
    "--html=reports/test-report.html",
    "--self-contained-html",
    "--md-report=reports/test-report.md",
]
